<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&amp;family=Overpass+Mono:wght@500;600&amp;display=swap">
<style>
/* Layout: site list beside (desktop) or before (phone) one site sheet: photo with pins, mark list, address actions. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --sunk:#E2E8ED; --ink:#141C24; --muted:#56636E; --line:#D0D8DF;
  --accent:#E8590C; --accent-ink:#FFFFFF; --hazard:#C92A2A; --pile:#1971C2; --ok:#2B8A3E; --ok-bg:#E3F3E7; --sel:#FAB005;
  --display:"Overpass","Arial Narrow",system-ui,sans-serif; --body:"Overpass",system-ui,-apple-system,sans-serif; --mono:"Overpass Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#17202A; --sunk:#111920; --ink:#E6EDF3; --muted:#94A2AE; --line:#2B3744;
  --accent:#FF7A2E; --accent-ink:#1A0D04; --hazard:#FF6B6B; --pile:#4DABF7; --ok:#69DB7C; --ok-bg:#17301F; --sel:#FFD43B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#17202A; --sunk:#111920; --ink:#E6EDF3; --muted:#94A2AE; --line:#2B3744;
  --accent:#FF7A2E; --accent-ink:#1A0D04; --hazard:#FF6B6B; --pile:#4DABF7; --ok:#69DB7C; --ok-bg:#17301F; --sel:#FFD43B; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{flex:none}
.brand h1{font-size:22px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.sum{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--hazard);border-color:color-mix(in srgb,var(--hazard) 45%,var(--line))}
.btn.danger.armed{background:var(--hazard);color:var(--surface);border-color:var(--hazard)}
.btn.status.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.btn.wide{width:100%}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}

.layout{display:grid;grid-template-columns:1fr;gap:20px;padding-top:16px}
.view-list .detail{display:none}
.view-detail .list{display:none}
@media (min-width:900px){
  .layout{grid-template-columns:340px minmax(0,1fr);align-items:start}
  .view-list .detail,.view-detail .list{display:block}
  .list{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);max-height:calc(100vh - 110px);overflow:auto;padding-right:4px}
  .back{display:none!important}
}

.list-tools{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{width:100%;min-height:42px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 12px}
.seg{display:flex;background:var(--sunk);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;min-height:34px;border:0;border-radius:7px;background:transparent;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.items{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.site{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px 10px 10px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer}
.site:hover{border-color:var(--muted)}
.site[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.rt{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);text-align:center;border:1.5px solid var(--line);border-radius:6px;padding:4px 0;font-variant-numeric:tabular-nums}
.site .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site .ad{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.site .rgt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cnt{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.chip.todo{border-color:var(--accent);color:var(--accent)}
.chip.ex{border-style:dashed}
.chip.walk{border-color:#111;color:#111;background:#00E5FF}
.chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.site-row{display:flex;gap:6px;align-items:stretch}
.site-row .site{flex:1;min-width:0}
.ordb{display:flex;flex-direction:column;gap:4px}
.ordb button{flex:1;width:36px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;font-size:11px;color:var(--muted)}
.ordb button:hover{border-color:var(--accent);color:var(--accent)}
.stops{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.stops .btn.primary{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

.detail{min-width:0;display:flex;flex-direction:column;gap:16px}
.view-detail .detail,.detail{display:flex}
.view-list .detail{display:none}
@media (min-width:900px){.view-list .detail{display:flex}}
.back{align-self:flex-start;border:0;background:none;color:var(--accent);font-weight:700;padding:4px 0;cursor:pointer}
.d-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.d-title h2{font-size:28px;font-weight:800;line-height:1.1}
.addr{margin:4px 0 0;color:var(--muted);user-select:all;-webkit-user-select:all}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.tools .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tools .seg{flex:1 1 100%;min-width:0;flex-wrap:wrap}
.tools .seg button{flex:1 1 auto;padding:0 8px}
.photo-scroll{overflow:auto;max-height:78vh;background:var(--sunk);touch-action:pan-x pan-y;overscroll-behavior:contain}
.photo-inner{position:relative;width:100%;margin:0 auto;line-height:0;user-select:none;-webkit-user-select:none}
.photo-inner img{width:100%;max-width:none;display:block;pointer-events:none}
.editing .photo-inner{cursor:crosshair}
.mk{position:absolute;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;border:1.5px solid #111;box-shadow:0 0 0 1px #fff;display:grid;place-items:center;font:700 8px/1 var(--mono);color:#111;cursor:pointer;padding:0;touch-action:none}
.mk span{display:none}
.mk::before{content:"";position:absolute;inset:-5px;border-radius:50%}
.mk.s{background:#FFD400}
.mk.f{background:#00E5FF}
.mk.h{background:#FF1744;color:#fff;border-radius:2px;transform:translate(-50%,-50%) rotate(45deg);width:9px;height:9px}
.mk.h span{transform:rotate(-45deg)}
.mk.p{background:#fff;border-radius:2px}
.mk.on{z-index:2;box-shadow:0 0 0 1.5px #fff,0 0 0 4px #D6249F}
.photo-inner.big .mk{width:15px;height:15px}
.photo-inner.big .mk.h{width:13px;height:13px}
.photo-inner.big .mk span{display:block}
.zoombar{display:flex;align-items:center;gap:6px}
.zoombar .zv{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums}
.zoombar .btn{min-width:36px;padding:0 8px}
.zone{position:absolute;z-index:1;border:2px solid;border-radius:4px;display:grid;place-items:center;touch-action:none;cursor:pointer;min-width:0}
.editing .zone{cursor:move}
.zone.h{border-color:#FF1744;background:rgb(255 23 68 / .3)}
.zone.p{border-color:#fff;border-style:dashed;background:rgb(255 255 255 / .32)}
.zone.draft{pointer-events:none;opacity:.8}
.zone.on{box-shadow:0 0 0 3px #D6249F}
.zl{font:800 11px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;padding:3px 5px;border-radius:3px;white-space:nowrap;pointer-events:none}
.zone.h .zl{background:#FF1744;color:#fff}
.zone.p .zl{background:#fff;color:#111}
.zone.draft .zl{display:none}
.handle{position:absolute;right:-7px;bottom:-7px;width:14px;height:14px;background:#D6249F;border:2px solid #fff;border-radius:3px;cursor:nwse-resize;touch-action:none}
.photo-inner.drawing{touch-action:none}
.mk{z-index:2}
.swatch{width:22px;height:16px;border-radius:3px;border:2px solid}
.swatch.h{border-color:#FF1744;background:rgb(255 23 68 / .35)}
.swatch.p{border-color:#111;border-style:dashed;background:#fff}
.photo-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot{border:1.5px solid #111}.dot.s{background:#FFD400}.dot.f{background:#00E5FF}.dot.h{background:#FF1744;border-radius:2px;transform:rotate(45deg)}.dot.p{background:#fff;border-radius:3px}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:36px 20px;background:var(--sunk);color:var(--muted)}
.drop.over{outline:3px dashed var(--accent);outline-offset:-10px}
.drop strong{color:var(--ink);font-size:16px}
.drop ol{text-align:left;margin:0;padding-left:20px;max-width:46ch;font-size:14px}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.sec h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.sec h3 small{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted)}
.marks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.marks li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.marks li.on{border-color:#D6249F;background:color-mix(in srgb,#D6249F 10%,transparent)}
.marks .pin{position:static;transform:none;width:22px;height:22px;font-size:11px;border-width:2px;box-shadow:none}
.marks .pin span{display:block}
.marks .pin.h{width:18px;height:18px}
.marks .pin::before{display:none}
.marks .pin.h{transform:rotate(45deg)}
.marks .k{font-weight:600}
.marks .tx{min-width:0}
.marks .tx p{margin:0;font-size:13px;color:var(--muted)}
.inp{width:100%;min-height:36px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:4px 10px;font-size:14px}
textarea.inp{min-height:84px;padding:8px 10px;resize:vertical}
.notes{margin:0;white-space:pre-wrap}
.form{display:grid;grid-template-columns:1fr 110px;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.form label .inp{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pad{padding:14px}
.placeholder{padding:60px 20px;text-align:center;color:var(--muted)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgb(0 0 0 / .12);display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .msg{flex:1;min-width:180px;font-size:14px}
.bar .msg small{display:block;font-family:var(--mono);font-size:12px;color:var(--muted)}
.bar .warn{color:var(--hazard)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 4px 16px rgb(0 0 0 / .25)}
@media (prefers-reduced-motion:no-preference){.site,.btn{transition:border-color .15s,background-color .15s}}

/* Crew + manager additions on top of the stake map styles */
html,body{margin:0}
body{padding-block:0 120px}
img{max-width:100%}
[hidden]{display:none!important}
.who{max-width:520px;margin:0 auto;padding-top:28px;display:flex;flex-direction:column;gap:14px}
.who h2{font-size:26px;font-weight:800}
.who .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.who .names button{min-height:64px;font-size:18px;font-weight:700;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.who .names button:hover{border-color:var(--accent)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:14px;align-self:flex-start}
.big{min-height:64px;font-size:19px;font-weight:800;letter-spacing:.02em;border-radius:12px;width:100%}
.btn.go{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.stop{background:var(--hazard);border-color:var(--hazard);color:#fff}
.shiftbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);z-index:6;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin:12px 0 0;border-radius:10px;background:var(--ok-bg);border:1px solid var(--ok);color:var(--ink)}
.shiftbar.off{background:var(--sunk);border-color:var(--line)}
.shiftbar b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shiftbar .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.on{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.pill.now{border-color:var(--accent);color:var(--accent-ink);background:var(--accent)}
.pill.off{opacity:.8}
.pill .blink{width:8px;height:8px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion:no-preference){.pill .blink{animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.25}}}
.stoplist{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.stop{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.stop.done{opacity:.72}
.stop.now{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.stop .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.stop .ad{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.stop .rgt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.work{display:flex;flex-direction:column;gap:12px;padding:14px}
.work .timer{font:800 34px/1 var(--mono);font-variant-numeric:tabular-nums}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks label{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600;cursor:pointer}
.checks input{width:22px;height:22px;accent-color:var(--ok)}
.checks label:has(input:checked){border-color:var(--ok);background:var(--ok-bg)}
.fieldlbl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.fieldlbl .inp{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);min-height:44px}
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:10px;align-items:center}
.footbar .btn{flex:1}
.confirm{display:flex;flex-direction:column;gap:12px;padding:16px}
.confirm h3{font-size:20px}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sumrow:last-child{border-bottom:0}
.queue{font-size:13px;color:var(--hazard);font-weight:600}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-top:10px}
.tabs button{flex:none;min-height:40px;padding:0 14px;border-radius:8px 8px 0 0;border:1px solid transparent;border-bottom:0;background:transparent;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:14px;display:flex;flex-direction:column;gap:14px}
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.lc{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.lc h3{font-size:18px}
.lc .meta{font-size:13px;color:var(--muted)}
.lc .bar2{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.lc .bar2 i{display:block;height:100%;background:var(--ok)}
.group h3{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:8px;align-items:baseline;margin:6px 0 8px}
.group h3 small{font-family:var(--mono);font-weight:500;letter-spacing:0;text-transform:none;color:var(--muted)}
.rrow{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:6px}
.rrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .ad{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- photos for the manager editor ---------- */
function compress(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){var max=2400,q=.8,out='';for(var i=0;i<8;i++){var sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*sc);c.height=Math.round(img.naturalHeight*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);out=c.toDataURL('image/webp',q);if(out.indexOf('data:image/webp')!==0)out=c.toDataURL('image/jpeg',q);if(out.length<380000)break;q-=.06;if(q<.5){max=Math.round(max*.85);q=.7}}URL.revokeObjectURL(url);res(out)};
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('bad image'))};img.src=url;
  });
}
function setPhoto(file){
  var s=mgr.editing;if(!s||!file)return;
  if(!/^image\//.test(file.type)){toast('That file is not an image. Use a screenshot (PNG or JPG).');return}
  toast('Adding photo…');
  compress(file).then(function(d){s._img=d;s._newImg=true;mgr.dirty=true;render();toast('Photo added. Save the site to keep it.')},function(){toast('Could not read that image.')});
}
function saveSite(){
  var s=mgr.editing;if(!s||mgr.saving)return;mgr.saving=true;render();
  var hc=null;if(s.hours){hc={};Object.keys(s.hours).forEach(function(k){var x=s.hours[k];if(x===null)hc[k]=null;else if(x&&x[0]&&x[1])hc[k]=x});if(!Object.keys(hc).length)hc=null}
  var body={id:s.id,name:s.name,address:s.address,notes:s.notes,marks:s.marks,hours:hc,zone:s.zone||''};
  mgrCall('mgrSaveSite',body).then(function(){return s._newImg?mgrCall('mgrPhoto',s.id,s._img):true}).then(function(){
    delete s._newImg;mgr.saving=false;mgr.dirty=false;s._isNew=false;toast('Saved. Crew phones get it within a minute.');return loadMgr();
  }).catch(function(e){mgr.saving=false;render();toast('Could not save: '+e.message)});
}
function runImport(file){
  var rd=new FileReader();
  rd.onload=function(){
    var j;try{j=JSON.parse(rd.result)}catch(e){toast('That file is not a stake map file.');return}
    var list=(j.sites||[]).filter(function(s){return s&&s.id&&s.name});if(!list.length){toast('No sites found in that file.');return}
    mgr.importing={done:0,total:list.length,name:list[0].name};render();
    var i=0;(function next(){
      if(i>=list.length){mgr.importing.done=list.length;render();toast('Imported '+list.length+' sites. Assign them under Routes.');loadMgr().then(function(){setTimeout(function(){mgr.importing=null;render()},4000)});return}
      var s=list[i];mgr.importing.name=s.name;mgr.importing.done=i;render();
      mgrCall('mgrImport',{id:s.id,name:s.name,address:s.address,notes:s.notes||'',route:s.route,marks:s.marks||[],img:s.img||''}).then(function(){i++;next()},function(e){mgr.importing.err='Stopped at '+s.name+': '+e.message+'. Choose the file again to continue.';render();setTimeout(function(){mgr.importing=null;render()},8000)});
    })();
  };
  rd.readAsText(file);
}
